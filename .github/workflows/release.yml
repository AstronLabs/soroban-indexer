name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/soroban-ingester
            ghcr.io/${{ github.repository }}/soroban-api

      - name: Build and push Ingester image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ingester
          push: true
          tags: ghcr.io/${{ github.repository }}/soroban-ingester:${{ github.ref_name }},ghcr.io/${{ github.repository }}/soroban-ingester:latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}/soroban-api:${{ github.ref_name }},ghcr.io/${{ github.repository }}/soroban-api:latest

  create-release:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
