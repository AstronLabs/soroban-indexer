name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: Rust Ingester Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: indexer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ingester/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Run DB Migrations
      run: |
        sudo apt-get install -y postgresql-client
        cat migrations/*.sql | PGPASSWORD=password psql -h localhost -U postgres -d indexer_test
    - name: Check formatting
      working-directory: ./ingester
      run: cargo fmt -- --check
    - name: Clippy
      working-directory: ./ingester
      run: cargo clippy -- -D warnings
    - name: Run tests
      working-directory: ./ingester
      env:
        DATABASE_URL: postgres://postgres:password@localhost:5432/indexer_test
      run: cargo test

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './api/package-lock.json'
    - name: Install dependencies
      working-directory: ./api
      run: npm ci
    - name: Lint
      working-directory: ./api
      run: npm run lint
    - name: Test
      working-directory: ./api
      run: npm test

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-rust, test-api]
    steps:
    - uses: actions/checkout@v4
    - name: Build Ingester
      run: docker build -f Dockerfile.ingester .
    - name: Build API
      run: docker build -f Dockerfile.api .
